name: CargoWhitelist
version: '1.0-SNAPSHOT'
main: ink.ziip.cargowhitelist.CargoWhitelist
api-version: '1.21'
load: STARTUP
libraries:
  - com.squareup.okhttp3:okhttp:4.12.0
  - com.alibaba:fastjson:2.0.57

commands:
  cw:
    description: CargoWhitelist 管理命令
    usage: /cw <add|remove|list|reload> [玩家]
    aliases: [cargowhitelist]
    permission: cargowhitelist.admin
    permission-message: §c你没有权限使用该命令

permissions:
  cargowhitelist.admin:
    description: CargoWhitelist 管理员命令
    default: op